<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="event-card(event)" class="wedding-card">
  <div class="event-card-img-wrap">
    <img th:src="@{'/images/events/' + ${event.imageName}}" th:alt="${event.name}" loading="lazy"
         onerror="this.src='https://placehold.co/400x250/6b0f1a/f8f1e2?text=Event'"/>
  </div>
  <div class="card-body">
    <h4 th:text="${event.name}">Event Name</h4>
    <p class="mb-1"><strong>Date:</strong> <span th:text="${event.date}">Date</span></p>
    <p class="mb-1"><strong>Time:</strong> <span th:text="${event.time}">Time</span></p>
    <p class="mb-1"><strong>Venue:</strong> <span th:text="${event.venue}">Venue</span></p>
    <p class="mb-1"><strong>Address:</strong> <span th:text="${event.address}">Address</span></p>
    <p class="mb-2"><span class="badge badge-gold" th:text="${event.dressCode}">Dress Code</span></p>
    <p th:text="${event.description}">Description</p>
    <a th:if="${event.mapLink}" th:href="${event.mapLink}" target="_blank" class="btn btn-sm btn-gold mt-2">View on Map</a>
  </div>
</div>
</body>
</html>
